name: forest_monitoring
version: "0.1.0"
config-version: 2
profile: forest_monitoring

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  country: FR
  thresholds: [10, 30, 50]
  default_threshold: 30
  first_loss_year: 2001
  alerts_start_date: "2023-01-01"

models:
  forest_monitoring:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  forest_monitoring:
    +schema: ref
