version: 2

models:
  - name: dim_region
    description: Metropolitan régions with forest extent at the default threshold (30 %).
    columns:
      - name: code
        description: INSEE région code (string).
        data_tests: [unique, not_null]
      - name: name
        description: Official région name.
      - name: slug
        description: URL-friendly name.
        data_tests: [unique]
      - name: area_km2
        description: Land area (km²).
      - name: forest_2000_ha
        description: Hansen forest area in 2000 (ha), treecover2000 >= 30 %.

  - name: dim_department
    description: Metropolitan départements with forest extent at the default threshold (30 %).
    columns:
      - name: code
        description: INSEE département code (string, e.g. "2A").
        data_tests: [unique, not_null]
      - name: name
        description: Official département name.
      - name: slug
        description: URL-friendly name.
        data_tests: [unique]
      - name: region_code
        description: Parent région code.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: code
      - name: area_km2
        description: Land area (km²).
      - name: forest_2000_ha
        description: Hansen forest area in 2000 (ha), treecover2000 >= 30 %.

  - name: mart_area_kpis
    description: >
      Headline indicators per level × area × forest threshold: latest-year loss, 5-year average,
      total since 2001, share of 2000 forest lost, 10-year trend, alerts over the last 4 weeks,
      and rank within the parent area (by latest-year loss). Loss is not deforestation.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [level, code, threshold]
    columns:
      - name: level
        description: Aggregation level (france, region, department).
      - name: code
        description: INSEE code of the area (FR for France).
      - name: name
        description: Area name.
        data_tests: [not_null]
      - name: parent_code
        description: Code of the parent area (null for France).
      - name: threshold
        description: Forest definition, treecover2000 >= threshold (%).
      - name: forest_2000_ha
        description: Forest area in 2000 (ha).
      - name: latest_year
        description: Latest Hansen loss year.
      - name: loss_latest_ha
        description: Loss in the latest year (ha).
      - name: loss_latest_pct
        description: Latest-year loss / forest 2000 (ratio).
      - name: loss_5y_avg_ha
        description: Average yearly loss over the 5 years ending at latest_year (ha).
      - name: loss_total_ha
        description: Total loss 2001 → latest_year (ha).
      - name: loss_total_pct
        description: Total loss / forest 2000 (ratio).
      - name: trend_slope_ha_per_year
        description: Linear regression slope of yearly loss over the last 10 years (ha/year).
      - name: alerts_last_4w_ha
        description: DIST-ALERT area over the 4 latest weeks (ha, all confidence levels).
      - name: latest_alert_week
        description: Monday of the latest alert week.
      - name: rank_in_parent
        description: Rank by latest-year loss among siblings (1 = most loss); null for France.

  - name: fct_loss_year
    description: >
      Annual Hansen tree cover loss for France, régions and départements, per forest threshold
      (treecover2000 >= threshold %). Région and France rows are sums of département rows.
      Tree cover loss is not deforestation.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [level, code, threshold, year]
    columns:
      - name: level
        description: Aggregation level.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [france, region, department]
      - name: code
        description: INSEE code of the area (FR for France). Unique only together with level.
        data_tests: [not_null]
      - name: parent_code
        description: Code of the parent area (région for a département, FR for a région).
      - name: threshold
        description: Forest definition, treecover2000 >= threshold (%).
        data_tests:
          - accepted_values:
              arguments:
                values: [10, 30, 50]
      - name: year
        description: Loss year.
      - name: forest_2000_ha
        description: Forest area in 2000 (ha) at this threshold.
      - name: loss_ha
        description: Tree cover loss (ha) this year.
      - name: loss_pct_of_2000
        description: loss_ha / forest_2000_ha (ratio, not percent).
      - name: cum_loss_ha
        description: Cumulative loss since 2001 (ha).
      - name: loss_ha_5y_avg
        description: Average loss over this year and the 4 previous years (ha).
      - name: yoy_change_pct
        description: Change vs previous year, as a ratio; null when previous year is 0.

  - name: fct_alerts_week
    description: >
      Weekly DIST-ALERT forest disturbance area for France, régions and départements, per forest
      threshold. Région and France rows are sums of département rows. Alerts are disturbances
      (harvest, fire, storm, dieback), not deforestation.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [level, code, threshold, week_start]
    columns:
      - name: level
        description: Aggregation level.
        data_tests:
          - accepted_values:
              arguments:
                values: [france, region, department]
      - name: code
        description: INSEE code of the area (FR for France).
      - name: parent_code
        description: Code of the parent area.
      - name: threshold
        description: Forest definition, treecover2000 >= threshold (%).
      - name: week_start
        description: Monday of the ISO week.
      - name: area_ha_nominal
        description: Nominal-confidence alert area (ha).
      - name: area_ha_high
        description: High-confidence alert area (ha).
      - name: area_ha_highest
        description: Highest-confidence alert area (ha).
      - name: area_ha_high_conf
        description: High + highest confidence (ha).
      - name: area_ha_all
        description: All confidence levels (ha).
      - name: area_ha_4w_rolling
        description: Sum of area_ha_all over this week and the 3 previous weeks (ha).

  - name: mart_alert_anomalies
    description: >
      Weekly alert area vs a baseline; a week is an anomaly when z >= 2. Baseline = the same
      ISO week of previous years once >= 2 previous years exist, otherwise the 12 previous
      weeks (GFW serves DIST-ALERT history from 2025-09-24 only).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [level, code, threshold, week_start]
    columns:
      - name: level
        description: Aggregation level (france, region, department).
      - name: code
        description: INSEE code of the area.
      - name: parent_code
        description: Code of the parent area.
      - name: threshold
        description: Forest definition, treecover2000 >= threshold (%).
      - name: week_start
        description: Monday of the ISO week.
      - name: iso_year
        description: ISO year of the week.
      - name: iso_week
        description: ISO week number (1-53).
      - name: area_ha_all
        description: Alert area this week, all confidence levels (ha).
      - name: history_years
        description: Number of previous years with the same ISO week.
      - name: baseline_method
        description: same_week (>= 2 previous years) or rolling_12w; null when no baseline yet.
        data_tests:
          - accepted_values:
              arguments:
                values: [same_week, rolling_12w]
      - name: baseline_mean_ha
        description: Mean area of the baseline weeks (ha).
      - name: baseline_std_ha
        description: Sample standard deviation of the baseline weeks (ha).
      - name: z_score
        description: (area - baseline mean) / baseline std; null without a baseline or when std = 0.
      - name: is_anomaly
        description: True when z_score >= 2.
        data_tests: [not_null]
