server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

  # Read-only API (same origin, so no CORS needed in production).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  # dbt docs, generated by `make docs` and mounted read-only.
  location /dbt-docs/ {
    alias /usr/share/nginx/dbt-docs/;
    try_files $uri $uri/ =404;
  }

  location ~* \.(js|css|svg|png|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  location /geo/ {
    types { application/geo+json geojson; }
    expires 1d;
  }

  # SPA routes (/r/84, /d/2A …).
  location / {
    try_files $uri /index.html;
  }
}
