name: Weekly alerts refresh

# Monday 06:00 Europe/Paris (05:00 UTC in winter, 04:00 UTC in summer → run at 04:30 UTC).
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write # publish the warehouse as a release asset

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip when secrets are missing
        id: guard
        run: |
          if [ -z "$GFW_API_KEY" ]; then
            echo "::notice::GFW_API_KEY secret is not set — skipping (see docs/SETUP_CREDENTIALS.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Download latest warehouse
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p data
          gh release download warehouse-latest --pattern warehouse.duckdb --dir data \
            || echo "::notice::No previous warehouse release — starting from scratch."

      - name: Extract and transform
        if: steps.guard.outputs.skip != 'true'
        run: |
          uv sync
          uv run dbt deps --project-dir dbt --profiles-dir dbt
          if [ ! -f data/warehouse.duckdb ]; then uv run forestfr extract boundaries; fi
          uv run forestfr extract alerts
          uv run dbt build --project-dir dbt --profiles-dir dbt
          uv run dbt source freshness --project-dir dbt --profiles-dir dbt

      - name: Refuse to publish synthetic data
        if: steps.guard.outputs.skip != 'true'
        run: uv run forestfr check-release

      - name: Publish warehouse release asset
        if: steps.guard.outputs.skip != 'true'
        run: |
          gh release view warehouse-latest >/dev/null 2>&1 \
            || gh release create warehouse-latest --title "Warehouse (latest)" \
                 --notes "DuckDB warehouse refreshed weekly by CI." --latest=false
          gh release upload warehouse-latest data/warehouse.duckdb --clobber
