[project]
name = "forestfr"
version = "0.1.0"
description = "Extract & load pipeline for the forest loss monitor (France)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "topojson>=1.9",
    "httpx>=0.27",
    "earthengine-api>=1.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.scripts]
forestfr = "forestfr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forestfr"]
